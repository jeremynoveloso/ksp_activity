<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Border</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="text-cyan-900">Hello World</div>
    <div class="bg-rose-800">Background Color</div>
    <div class="border-2 border-blue-500">Border</div>
    <div class="text-[#ff0000]">Custom Color</div>
    <div class="border-x-3">Border</div>
    <div class="border-l-4">Left Border</div>
    <div class="border-b-4">Bottom Border</div>
    <div class="shadow-md">SShadow</div>
    <div class="shadow-xl">SShadow</div>
</body>
</html>
